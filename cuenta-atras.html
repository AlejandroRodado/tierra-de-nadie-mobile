<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#291424"><title>Cuenta atrás | Tierra de Nadie</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#291424;color:#fff;font-family:Montserrat,Arial,sans-serif}.escena{height:100vh;height:100dvh;position:relative;overflow:hidden;isolation:isolate}.fondo{position:absolute;inset:0;background:url('./imagenes/cuenta-atras.jpg') center/cover no-repeat;z-index:-3}.velo{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(20,9,25,.24),rgba(20,9,25,.08) 40%,rgba(20,9,25,.48));z-index:-2}.palabras{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}.palabra{position:absolute;top:0;left:0;white-space:nowrap;font-size:clamp(10px,1.3vw,18px);font-weight:500;letter-spacing:.11em;color:#f5d8d8;opacity:0;text-shadow:0 2px 14px #0008;will-change:transform,opacity;animation:viajar var(--duracion) linear var(--retraso) infinite}.palabra.destacada{font-weight:800;font-size:clamp(15px,2vw,27px);color:#ffc18c;text-shadow:0 0 12px #ff9c6588,0 0 30px #ff9c6544}@keyframes viajar{0%{opacity:0;transform:translate3d(var(--inicio-x),var(--inicio-y),0)}12%{opacity:var(--opacidad)}65%{opacity:var(--opacidad)}92%,100%{opacity:0;transform:translate3d(var(--final-x),var(--final-y),0)}}.titulo{position:absolute;z-index:4;top:7%;width:100%;margin:0;text-align:center;font:600 clamp(27px,5vw,56px) 'Cormorant Garamond',serif;letter-spacing:.16em;text-shadow:0 3px 20px #0008}.centro{position:absolute;z-index:4;top:45%;left:50%;transform:translate(-50%,-50%);width:min(94%,680px);text-align:center;padding:28px 10px}.centro:before{content:'';position:absolute;z-index:-1;inset:-35px -10px;background:radial-gradient(ellipse,#230c1fb8 0%,#230c1f50 48%,transparent 75%);pointer-events:none}.subtitulo{font-size:clamp(9px,1.4vw,12px);letter-spacing:.28em;font-weight:600;color:#f9c6b2;margin:0 0 19px}.contador{display:flex;justify-content:center;align-items:center;gap:clamp(2px,1.3vw,15px);font-variant-numeric:tabular-nums}.unidad{min-width:0;display:flex;flex-direction:column;align-items:center;gap:9px}.numero{font:600 clamp(39px,9vw,100px)/1 'Cormorant Garamond',serif;color:#fff4eb;text-shadow:0 0 28px #ffaa7b55}.etiqueta{font-size:clamp(7px,1.05vw,10px);letter-spacing:.12em;color:#f3d1c9}.separador{font:500 clamp(35px,7vw,80px) 'Cormorant Garamond',serif;color:#f8b998;margin-bottom:21px;opacity:.85}.pie{position:absolute;z-index:4;bottom:5%;width:100%;text-align:center;font-size:clamp(9px,1.2vw,12px);letter-spacing:.2em;color:#ffe1d2;text-shadow:0 2px 12px #000}.final{display:none}.final h2{font:600 clamp(32px,6vw,60px) 'Cormorant Garamond',serif;margin:0 0 22px}.final a{display:inline-block;color:white;text-decoration:none;padding:15px 25px;border:1px solid #ffd2becb;border-radius:3px;font-size:11px;letter-spacing:.15em;background:#280f1e88}.final a:hover{background:#96374ba6}@media(max-width:600px){.titulo{top:8%;font-size:30px}.centro{top:43%;width:100%;padding:20px 5px}.numero{font-size:clamp(40px,10.5vw,65px)}.separador{font-size:40px;margin-bottom:19px}.palabra{font-size:10px;letter-spacing:.06em}.palabra.destacada{font-size:15px}.pie{bottom:6%}}@media(prefers-reduced-motion:reduce){.palabra{animation:none;opacity:.45}}
</style></head><body><main class="escena"><div class="fondo"></div><div class="velo"></div><div class="palabras" id="palabras"></div><h1 class="titulo">TIERRA DE NADIE</h1><section class="centro"><div id="cuenta"><p class="subtitulo">ALGO ESTÁ A PUNTO DE COMENZAR</p><div class="contador"><div class="unidad"><span class="numero" id="dias">00</span><span class="etiqueta">DÍAS</span></div><span class="separador">:</span><div class="unidad"><span class="numero" id="horas">00</span><span class="etiqueta">HORAS</span></div><span class="separador">:</span><div class="unidad"><span class="numero" id="minutos">00</span><span class="etiqueta">MINUTOS</span></div><span class="separador">:</span><div class="unidad"><span class="numero" id="segundos">00</span><span class="etiqueta">SEGUNDOS</span></div></div></div><div class="final" id="final"><h2>TIERRA DE NADIE YA ESTÁ AQUÍ</h2><a href="./index.html">ENTRAR EN EL HOSPITAL</a></div></section><p class="pie">UNA HISTORIA DE ALEJANDRO RODADO</p></main>
<script>
// 18 de noviembre de 2026, 21:00, hora peninsular española.
const FECHA_ESTRENO=new Date('2026-11-18T21:00:00+01:00');
const palabras=['EXAGERADO','ENAMORADO','DIFERENTE','ESCRITOR','RUBIO','RETORCIDO','INTROVERTIDO','ANSIOSO','POETA','PENSADOR','ESTUDIANTE','FEO','INÚTIL','HERMANO','HIJO','AMIGO','MISTERIOSO','SOÑADOR','SOLITARIO','SENSIBLE','INSEGURO','VALIENTE','COBARDE','CALLADO','RARO','INTENSO','FRÁGIL','FUERTE','PERDIDO','ROTO','CREATIVO','IMPERFECTO','INCOMPRENDIDO','MELANCÓLICO','NOSTÁLGICO','OBSERVADOR','IMAGINATIVO','DESPISTADO','CURIOSO','APASIONADO','TÍMIDO','MIEDOSO','INQUIETO','REFLEXIVO','VULNERABLE','HUMANO','DESCONOCIDO'];
const destacadas=new Set(['EXAGERADO','ENAMORADO','DIFERENTE','ESCRITOR']);const capa=document.getElementById('palabras');
function crearPalabras(){capa.replaceChildren();const w=innerWidth,h=innerHeight,cantidad=w<600?55:85;for(let i=0;i<cantidad;i++){const palabra=palabras[i%palabras.length],el=document.createElement('span');el.className='palabra'+(destacadas.has(palabra)?' destacada':'');el.textContent=palabra;const zona=i%4;let x,y;if(zona===0){x=Math.random()*w*.4;y=-50-Math.random()*h*.25}else if(zona===1){x=w*.6+Math.random()*w*.35;y=-50-Math.random()*h*.25}else if(zona===2){x=Math.random()*w*.4;y=h+Math.random()*h*.25}else{x=w*.6+Math.random()*w*.35;y=h+Math.random()*h*.25}const cx=w*.5,cy=h*(w<600?.43:.45),angle=Math.atan2(cy-y,cx-x),safe=w<600?125:230,fx=cx-Math.cos(angle)*safe,fy=cy-Math.sin(angle)*safe,duration=12+Math.random()*16;el.style.setProperty('--inicio-x',x+'px');el.style.setProperty('--inicio-y',y+'px');el.style.setProperty('--final-x',fx+'px');el.style.setProperty('--final-y',fy+'px');el.style.setProperty('--duracion',duration+'s');el.style.setProperty('--retraso',-Math.random()*duration+'s');el.style.setProperty('--opacidad',destacadas.has(palabra)?'.95':String(.35+Math.random()*.4));capa.appendChild(el)}}
function actualizarCuenta(){const restante=FECHA_ESTRENO.getTime()-Date.now();if(restante<=0){document.getElementById('cuenta').style.display='none';document.getElementById('final').style.display='block';return}const valores=[Math.floor(restante/86400000),Math.floor(restante/3600000)%24,Math.floor(restante/60000)%60,Math.floor(restante/1000)%60];['dias','horas','minutos','segundos'].forEach((id,i)=>document.getElementById(id).textContent=String(valores[i]).padStart(2,'0'))}crearPalabras();actualizarCuenta();setInterval(actualizarCuenta,1000);let resizeTimeout;addEventListener('resize',()=>{clearTimeout(resizeTimeout);resizeTimeout=setTimeout(crearPalabras,250)});
</script></body></html>
