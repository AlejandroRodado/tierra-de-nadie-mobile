
<!DOCTYPE html>
<html lang="es">

<head>
    <!-- CONFIGURACIÓN GENERAL -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#160e0c">
    <meta name="description" content="Explora la tercera planta de Tierra de Nadie, una historia de Alejandro Rodado.">

    <title>Tierra de Nadie · Alejandro Rodado</title>

    <!-- HOJA DE ESTILOS -->
    <link rel="stylesheet" href="styles.css">

    <!-- JAVASCRIPT -->
    <script src="script.js" defer></script>
</head>

<body>
    <main class="app">

        <!-- ==========================================
             1. PANTALLA DE BIENVENIDA
        =========================================== -->
        <section class="portada pantalla" id="portada" aria-labelledby="titulo">

            <div class="velo"></div>

            <div class="portada__texto">
                <h1 id="titulo">
                    TIERRA DE <span>NADIE</span>
                </h1>

                <p>
                    UNA HISTORIA DE <span>ALEJANDRO RODADO</span>
                </p>
            </div>

            <button class="boton-entrar" id="entrar" type="button">
                ENTRAR AL HOSPITAL
                <span aria-hidden="true">→</span>
            </button>

        </section>


        <!-- ==========================================
             2. HOSPITAL - TERCERA PLANTA
        =========================================== -->
        <section class="hospital pantalla" id="hospital" aria-labelledby="hospital-titulo" hidden>

            <!-- BARRA DE NAVEGACIÓN -->
            <header class="barra">

                <button
                    type="button"
                    id="volver"
                    class="icono-boton"
                    aria-label="Volver a la portada">
                    ←
                </button>

                <div>
                    <span class="micro">TIERRA DE NADIE</span>
                    <strong>PLANTA 3</strong>
                </div>

                <button
                    type="button"
                    id="novedadesBtn"
                    class="icono-boton"
                    aria-label="Ver novedades">
                    ✦
                </button>

            </header>


            <!-- INTRODUCCIÓN AL HOSPITAL -->
            <div class="hospital__intro">

                <p class="etiqueta">
                    HOSPITAL · TERCERA PLANTA
                </p>

                <h2 id="hospital-titulo" tabindex="-1">
                    No todas las puertas llevan a una salida.
                </h2>

                <p>Elige dónde entrar.</p>

            </div>


            <!-- ======================================
                 3. PASILLO INTERACTIVO
            ======================================= -->
            <div class="pasillo" aria-label="Pasillo interactivo del hospital">

                <div class="pasillo__luz"></div>

                <!-- HABITACIONES -->
                <div class="puertas">

                    <!-- HABITACIÓN 312 -->
                    <button class="puerta" data-room="312" type="button">

                        <span class="placa">312</span>

                        <span class="puerta__nombre">
                            Habitación 312
                        </span>

                        <span class="puerta__estado">
                            Entrar ↗
                        </span>

                    </button>


                    <!-- HABITACIÓN 315 -->
                    <button class="puerta cerrada" data-room="315" type="button">

                        <span class="placa">315</span>

                        <span class="puerta__nombre">
                            Habitación 315
                        </span>

                        <span class="puerta__estado">
                            🔒 Cerrada
                        </span>

                    </button>

                </div>

                <!-- ELEMENTOS DECORATIVOS -->
                <div class="pasillo__suelo"></div>

                <div class="pasillo__final">
                    TERCERA PLANTA
                </div>

            </div>


            <!-- ======================================
                 4. OTROS LUGARES DEL HOSPITAL
            ======================================= -->
            <div class="destinos">

                <!-- AZOTEA -->
                <button class="destino" data-room="azotea" type="button">

                    <span>☼</span>

                    <span>
                        <strong>La azotea</strong>
                        <small>Aquí arriba, el tiempo era distinto.</small>
                    </span>

                    <span>↗</span>

                </button>


                <!-- CONTROL DE ENFERMERÍA -->
                <button class="destino" data-room="enfermeria" type="button">

                    <span>✚</span>

                    <span>
                        <strong>Control de enfermería</strong>
                        <small>Alguien tenía que quedarse.</small>
                    </span>

                    <span>⌁</span>

                </button>

            </div>


            <!-- PIE DE PÁGINA -->
            <footer class="pie">
                UNA HISTORIA DE ALEJANDRO RODADO
            </footer>

        </section>


        <!-- ==========================================
             5. VENTANA MODAL
        =========================================== -->
        <div class="modal" id="modal" hidden>

            <!-- FONDO OSCURECIDO -->
            <div class="modal__fondo" data-close="true"></div>

            <!-- CONTENIDO DEL MODAL -->
            <section
                class="modal__panel"
                role="dialog"
                aria-modal="true"
                aria-labelledby="modalTitulo"
                tabindex="-1">

                <!-- BOTÓN CERRAR -->
                <button
                    class="modal__cerrar"
                    id="cerrar"
                    type="button"
                    aria-label="Cerrar">
                    ✕
                </button>

                <!-- INFORMACIÓN -->
                <p class="etiqueta" id="modalEtiqueta">
                    EXPEDIENTE
                </p>

                <h2 id="modalTitulo"></h2>

                <p id="modalTexto"></p>

                <div id="modalExtra"></div>

                <!-- VOLVER AL PASILLO -->
                <button
                    class="modal__volver"
                    id="cerrarAbajo"
                    type="button">
                    Volver al pasillo →
                </button>

            </section>

        </div>

    </main>
</body>

</html>
