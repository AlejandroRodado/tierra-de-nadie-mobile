<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160e0c">
  <meta name="description" content="Entra en el hospital de Tierra de Nadie, una historia de Alejandro Rodado.">
  <title>Tierra de Nadie · Alejandro Rodado</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app" id="app">
    <section class="portada pantalla" id="portada" aria-labelledby="titulo">
      <div class="velo" aria-hidden="true"></div>
      <div class="portada__texto">
        <h1 id="titulo">TIERRA DE <span>NADIE</span></h1>
        <p>UNA HISTORIA DE <span>ALEJANDRO RODADO</span></p>
      </div>
      <button class="boton-entrar" id="entrar" type="button">ENTRAR AL HOSPITAL <span aria-hidden="true">→</span></button>
    </section>
    <section class="interior pantalla" id="interior" aria-labelledby="interior-titulo" hidden>
      <div class="interior__contenido">
        <p class="etiqueta">HOSPITAL · TERCERA PLANTA</p>
        <h2 id="interior-titulo">Bienvenido al hospital</h2>
        <p>Algunas puertas todavía no están preparadas para abrirse.</p>
        <div class="habitaciones">
          <button type="button" class="habitacion" data-room="312">Habitación 312 <span>↗</span></button>
          <button type="button" class="habitacion" data-room="315">Habitación 315 <span>🔒</span></button>
          <button type="button" class="habitacion" data-room="azotea">La azotea <span>↗</span></button>
        </div>
        <p class="mensaje" id="mensaje" role="status" aria-live="polite">Selecciona una puerta para explorar.</p>
        <button class="volver" id="volver" type="button">← Volver a la entrada</button>
      </div>
    </section>
  </main>
</body>
</html>
